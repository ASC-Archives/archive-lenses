<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>ASC Archive Lenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --stone:#f3f1ec; --paper:#fbfaf7; --line:#ddd8cf; --ink:#2b2724; --muted:#6f6760;
  --iron:#6b4f43; --verd:#3d7c71; --verd-soft:#e3efec; --gold:#b08a3e; --rose:#a2564f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--stone);color:var(--ink);font:16px/1.5 "Newsreader",Georgia,serif}
a{color:var(--verd)}
button{font:inherit;color:inherit}
.mono{font-family:"Spline Sans Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.02em}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header{background:var(--paper);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 0 14px;flex-wrap:wrap}
h1{font:700 28px/1.1 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.01em}
h1 small{display:block;font:400 15px/1.4 "Newsreader",serif;color:var(--muted);margin-top:6px;letter-spacing:0}
.lenses{display:flex;gap:4px;flex-wrap:wrap}
.lenses button{font:600 14px "Bricolage Grotesque",sans-serif;border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer}
.lenses button.on{background:var(--ink);color:var(--paper)}
.lenses button:hover:not(.on){background:var(--stone)}

/* handle bar */
.handles{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(43,39,36,.04)}
.hb{display:grid;grid-template-columns:120px 1.3fr 1.2fr 1fr auto;gap:18px;align-items:center;padding:12px 0}
.h{min-width:0}
.h label,.hlabel{display:block;font:600 11px "Bricolage Grotesque",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--iron);margin-bottom:4px}
.dial svg{display:block;cursor:pointer}
.dial .sec{fill:#ece7de;stroke:var(--paper);stroke-width:2;transition:fill .15s}
.dial .sec:hover{fill:#d9e8e4}
.dial .sec.on{fill:var(--verd)}
.dial .hub{fill:var(--paper);stroke:var(--line)}
.dial text{font:600 9px "Bricolage Grotesque",sans-serif;fill:var(--muted);pointer-events:none}
.conceptname{font:600 13px "Bricolage Grotesque",sans-serif;color:var(--ink);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.range{position:relative;height:30px}
.range input{position:absolute;left:0;right:0;top:6px;width:100%;pointer-events:none;-webkit-appearance:none;appearance:none;background:none;margin:0}
.range input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--iron);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--iron);cursor:grab}
.range input::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--iron);border:2px solid var(--paper);cursor:grab}
.range .track{position:absolute;left:0;right:0;top:14px;height:4px;background:var(--line);border-radius:2px}
.range .fill{position:absolute;top:14px;height:4px;background:var(--iron);border-radius:2px}
.years{display:flex;justify-content:space-between;font:500 13px "Spline Sans Mono",monospace;color:var(--ink)}
.person{display:flex;gap:6px}
.person input{flex:1;min-width:0;font:15px "Newsreader",serif;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.seg button{border:0;background:#fff;padding:3px 9px;font:600 12px "Bricolage Grotesque",sans-serif;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--iron);color:#fff}
.seg button:disabled{opacity:.45;cursor:default}
.cols{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 9px;font:600 12px "Bricolage Grotesque",sans-serif;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.off{opacity:.38}
.act{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.btn{font:600 13px "Bricolage Grotesque",sans-serif;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* main */
main{padding:18px 0 40px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.say{font:15px/1.45 "Newsreader",serif;color:var(--muted);margin:0 0 10px}
.say b{color:var(--ink);font-weight:500}
#stage{min-height:520px}
#stage svg{display:block;width:100%;height:auto}
.axis text{font:11px "Spline Sans Mono",monospace;fill:var(--muted)}
.axis path,.axis line{stroke:var(--line)}
.ghost{fill:#e8e3da}
.stream{stroke:var(--paper);stroke-width:.6;cursor:pointer}
.stream:hover{opacity:.85}
.conf line{stroke:var(--gold);stroke-dasharray:2 3}
.ringlab{font:600 13px "Bricolage Grotesque",sans-serif;fill:var(--ink)}
.ringsub{font:12px "Spline Sans Mono",monospace;fill:var(--muted)}
.ringsec{cursor:pointer}
.ringsec .bg{fill:#efeae1;stroke:var(--paper);stroke-width:3}
.ringsec.on .bg{fill:var(--verd-soft)}
.ringsec:hover .bg{fill:#e6efe9}
.dot{cursor:pointer;stroke:var(--paper);stroke-width:.8}
.dot:hover{stroke:var(--ink);stroke-width:1.6}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font:13px/1.35 "Newsreader",serif;padding:6px 9px;border-radius:7px;max-width:320px;opacity:0;transition:opacity .1s;z-index:20}

.side h3{font:700 15px "Bricolage Grotesque",sans-serif;margin:0 0 4px}
.count{font:700 34px/1 "Bricolage Grotesque",sans-serif;color:var(--iron)}
.list{list-style:none;margin:10px 0 0;padding:0;max-height:640px;overflow:auto}
.list li{border-top:1px solid var(--line);padding:8px 0;cursor:pointer}
.list li:hover .t{color:var(--verd)}
.list .t{font-size:15px;line-height:1.3}
.list .m{color:var(--muted)}
.detail{border:1px solid var(--verd);background:#fff;border-radius:10px;padding:12px;margin-top:10px}
.detail .t{font:500 17px/1.3 "Newsreader",serif;margin:2px 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font:600 12px "Bricolage Grotesque",sans-serif;color:var(--iron);background:#fff;cursor:pointer}
.tag.c{color:var(--verd);border-color:#bcd8d1}
.withheld{font:12px "Spline Sans Mono",monospace;color:var(--rose)}
.reading .item{border-top:1px solid var(--line);padding:12px 0}
.reading .item:first-child{border-top:0}
.reading .t{font:500 17px/1.3 "Newsreader",serif}
.reading .snip{color:var(--muted);font-size:15px;margin-top:2px}
.reading h4{font:700 13px "Bricolage Grotesque",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--iron);margin:18px 0 2px}

/* Eucrates lens */
.about{max-width:760px}.about h2{font:700 22px "Bricolage Grotesque",sans-serif;margin:0 0 8px}.about h3{font:700 16px "Bricolage Grotesque",sans-serif;margin:18px 0 4px}.about p,.about li{font-size:16px}.about dt{font:600 15px "Bricolage Grotesque",sans-serif;margin-top:10px}.about dd{margin:2px 0 0 0}
.fb{max-width:720px}.fb label{display:block;font:600 13px "Bricolage Grotesque",sans-serif;margin:14px 0 4px}.fb input,.fb select,.fb textarea{width:100%;box-sizing:border-box;font:16px "Newsreader",serif;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}.fb textarea{min-height:140px;resize:vertical}.fb .send{margin-top:16px;font:600 14px "Bricolage Grotesque",sans-serif;background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:10px 16px;cursor:pointer}.fb .fbnote{color:var(--muted);font-size:14px}
.euc{display:grid;grid-template-columns:420px minmax(0,1fr);gap:18px;align-items:start}
.plate{background:#dcd8c4;background-image:radial-gradient(rgba(120,100,60,.08) 1px,transparent 1px);background-size:5px 5px;border:1px solid #c4bea6;border-radius:6px;padding:8px;box-shadow:inset 0 0 0 4px #e6e2cf}
.plate svg{display:block;width:100%;height:auto;touch-action:none}
.plate .lab{font:600 11px "Spline Sans Mono",monospace;letter-spacing:.12em;fill:#4a463c}
.plate .tick{stroke:#3d3a33;stroke-width:1.6}
.plate .knob{cursor:grab}
.plate .knob:focus{outline:none}
.plate .knob:focus .cap{stroke:#3d7c71;stroke-width:2.5}
.plate .lamp{stroke:#8c8770;stroke-width:1}
.plate .credit{font:10px "Newsreader",serif;fill:#5c574a}
.euc .read{font:12px "Spline Sans Mono",monospace;color:var(--muted);margin:6px 2px 0}
.offers{display:grid;gap:10px}
.offer{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.offer .t{font:500 16px/1.3 "Newsreader",serif}
.offer .why{font:12px "Spline Sans Mono",monospace;color:var(--verd);margin-top:4px}
.offer .acts{display:flex;gap:6px;margin-top:8px}
.offer .acts button{font:600 12px "Bricolage Grotesque",sans-serif;border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 9px;cursor:pointer}
.offer .acts .go{background:var(--verd);border-color:var(--verd);color:#fff}
.attn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.attn h5{font:700 11px "Bricolage Grotesque",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--iron);margin:0 0 4px}
.bar{display:flex;align-items:center;gap:6px;font:12px "Spline Sans Mono",monospace;color:var(--ink);margin:2px 0}
.bar span.b{height:7px;border-radius:4px;background:var(--verd);display:inline-block}
.bar span.b.bored{background:var(--rose)}
.log{font:12px/1.5 "Spline Sans Mono",monospace;color:var(--muted);margin-top:12px;max-height:180px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
@media (max-width:1100px){.euc{grid-template-columns:1fr}}
footer{color:var(--muted);font-size:13px;padding:0 0 30px}
@media (max-width:980px){.hb{grid-template-columns:110px 1fr;}.layout{grid-template-columns:1fr}.act{flex-direction:row}}
</style>
</head>
<body>
<header>
 <div class="wrap top">
  <h1>ASC Archive Lenses<small>One archive, many ways of looking. Turn the handles and every lens follows. Share the link and others see what you see.</small></h1>
  <div class="lenses" id="lenses">
   <button data-l="river">River</button>
   <button data-l="ring">Ring</button>
   <button data-l="reading">Reading room</button>
   <button data-l="eucrates">Eucrates</button>
   <button data-l="feedback">Feedback</button>
   <button data-l="about">About</button>
  </div>
 </div>
</header>

<div class="handles">
 <div class="wrap hb">
  <div class="h dial">
   <span class="hlabel">Principle</span>
   <svg id="dial" width="96" height="96" viewBox="-48 -48 96 96" role="group" aria-label="Choose a principle"></svg>
  </div>
  <div class="h">
   <span class="hlabel">Time</span>
   <div class="years"><span id="yFrom"></span><span id="yTo"></span></div>
   <div class="range"><div class="track"></div><div class="fill" id="rFill"></div>
    <input type="range" id="rFrom" aria-label="From year"><input type="range" id="rTo" aria-label="To year"></div>
   <div class="conceptname" id="conceptName"></div>
  </div>
  <div class="h">
   <label for="pIn">Person</label>
   <div class="person"><input id="pIn" list="pList" placeholder="Anyone (type a name)"><button class="btn" id="pClear" title="Clear person">×</button></div>
   <datalist id="pList"></datalist>
   <div class="seg" id="depth" role="group" aria-label="How far out">
    <button data-d="0">Their own</button><button data-d="1">+ one step</button><button data-d="2">+ two steps</button>
   </div>
  </div>
  <div class="h">
   <span class="hlabel">Collections</span>
   <div class="cols" id="cols"></div>
  </div>
  <div class="act">
   <button class="btn dark" id="share">Copy link</button>
   <button class="btn" id="reset">Reset</button>
  </div>
 </div>
</div>

<main class="wrap">
 <div class="layout">
  <section class="panel"><p class="say" id="say"></p><div id="stage"></div></section>
  <aside class="panel side">
   <h3>Selected</h3>
   <div class="count" id="count">…</div>
   <div class="mono" id="countSub" style="color:var(--muted)"></div>
   <div id="detail"></div>
   <ul class="list" id="list"></ul>
  </aside>
 </div>
</main>
<footer class="wrap" id="foot"></footer>
<div class="tip" id="tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="config.js"></script>
<script>
(async function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORS = ['#3d7c71','#6b4f43','#b08a3e','#a2564f','#5b6f8f','#7b8f4e','#8a6a9a','#4f8a9a'];

/* ---------- load the shared data ---------- */
let D = null, source = '';
for (const u of [window.ASC_DATA_URL, 'data.json'].filter(Boolean)) {
  try { const r = await fetch(u, {cache:'no-cache'}); if (r.ok) { D = await r.json(); source = u; break; } } catch(e) {}
}
if (!D) { $('#stage').innerHTML = '<p>The archive data could not be loaded.</p>'; return; }

const items = D.items.filter(i => i.collection !== 'collection:cybernetics-literacy' || !/^Principle/.test(i.title));
const byH = Object.fromEntries(D.items.map(i => [i.handle, i]));
const people = Object.fromEntries(D.people.map(p => [p.handle, p]));
const concepts = D.concepts;
const conceptBy = Object.fromEntries(concepts.map(c => [c.handle, c]));
const cols = D.collections;
const colColor = Object.fromEntries(cols.map((c,k) => [c.handle, COLORS[k % COLORS.length]]));
const colName = Object.fromEntries(cols.map(c => [c.handle, c.name]));
const years = items.map(i => i.year).filter(Boolean);
const Y0 = d3.min(years), Y1 = Math.max(d3.max(years), 2026);
const confYears = new Set(D.places.map(p => (p.name.match(/^(?:ASC|C:ADM)\s*(\d{4})/)||[])[1]).filter(Boolean).map(Number));
const nameToH = {}; D.people.forEach(p => nameToH[p.name.toLowerCase()] = p.handle);
$('#pList').innerHTML = D.people.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p => `<option value="${esc(p.name)}">`).join('');

/* co-occurrence for person depth */
const co = {};
for (const i of D.items) { const ps = i.people.map(p => p.person); for (const a of ps) for (const b of ps) if (a!==b) (co[a] ||= new Set()).add(b); }

/* ---------- state: the handles ---------- */
const KDEF = {ext:4, int:3, obl:2, nov:3, rei:3, obs:2};
const S = {knobs:{...KDEF}, lens:'river', from:Y0, to:Y1, concept:'', person:'', depth:0, cols:new Set(cols.map(c=>c.handle)), pick:''};
function readHash(){
  const q = new URLSearchParams(location.hash.slice(1));
  S.lens = ['river','ring','reading','eucrates','feedback','about'].includes(q.get('lens')) ? q.get('lens') : 'river';
  S.from = +q.get('from') || Y0; S.to = +q.get('to') || Y1;
  S.concept = q.get('concept') ? 'concept:' + q.get('concept') : '';
  S.person = q.get('person') ? 'person:' + q.get('person') : '';
  S.depth = Math.min(2, +q.get('depth') || 0);
  S.cols = q.get('cols') ? new Set(q.get('cols').split(',').map(c => 'collection:' + c)) : new Set(cols.map(c=>c.handle));
  S.pick = q.get('item') ? 'item:' + q.get('item') : '';
  const kk = (q.get('knobs')||'').split('').map(Number); S.knobs = {...KDEF}; if (kk.length===6 && kk.every(n => n>=0 && n<=6)) ['ext','int','obl','nov','rei','obs'].forEach((k,j) => S.knobs[k]=kk[j]);
}
function writeHash(){
  const q = new URLSearchParams();
  if (S.lens!=='river') q.set('lens', S.lens);
  if (S.from!==Y0) q.set('from', S.from);
  if (S.to!==Y1) q.set('to', S.to);
  if (S.concept) q.set('concept', S.concept.slice(8));
  if (S.person) { q.set('person', S.person.slice(7)); if (S.depth) q.set('depth', S.depth); }
  if (S.cols.size !== cols.length) q.set('cols', [...S.cols].map(c => c.slice(11)).join(','));
  if (S.pick) q.set('item', S.pick.slice(5));
  const ks = ['ext','int','obl','nov','rei','obs'].map(k => S.knobs[k]).join(''); if (S.lens==='eucrates' && ks !== Object.values(KDEF).join('')) q.set('knobs', ks);
  const h = q.toString(); history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
}
function set(patch){ Object.assign(S, patch); writeHash(); render(); }

/* ---------- the selector ---------- */
function circle(){
  if (!S.person) return null;
  let ring = new Set([S.person]), frontier = new Set([S.person]);
  for (let d=0; d<S.depth; d++){ const next = new Set(); frontier.forEach(p => (co[p]||[]).forEach(q => { if (!ring.has(q)) { next.add(q); ring.add(q); } })); frontier = next; }
  return ring;
}
function select(){
  const circ = circle(); const full = S.from===Y0 && S.to===Y1;
  return items.filter(i =>
    S.cols.has(i.collection) &&
    (i.year ? (i.year>=S.from && i.year<=S.to) : full) &&
    (!S.concept || i.concepts.includes(S.concept)) &&
    (!circ || i.people.some(p => circ.has(p.person))));
}

/* ---------- handles UI ---------- */
function drawDial(){
  const svg = d3.select('#dial'); svg.selectAll('*').remove();
  const arc = d3.arc().innerRadius(18).outerRadius(46).padAngle(.03).cornerRadius(3);
  const pie = d3.pie().value(1).sort(null).startAngle(-Math.PI/7).endAngle(2*Math.PI - Math.PI/7);
  const g = svg.selectAll('g').data(pie(concepts)).join('g').on('click', (e,d) => set({concept: S.concept===d.data.handle ? '' : d.data.handle, pick:''}));
  g.append('path').attr('class', d => 'sec' + (S.concept===d.data.handle ? ' on' : '')).attr('d', arc).append('title').text(d => d.data.number + ' · ' + d.data.name);
  g.append('text').attr('transform', d => `translate(${arc.centroid(d)})`).attr('text-anchor','middle').attr('dy','.35em')
    .style('fill', d => S.concept===d.data.handle ? '#fff' : null).text(d => d.data.number);
  svg.append('circle').attr('class','hub').attr('r',16).on('click', () => set({concept:'', pick:''})).append('title').text('All principles');
  svg.append('text').attr('text-anchor','middle').attr('dy','.35em').text(S.concept ? '×' : 'all');
  $('#conceptName').textContent = S.concept ? `Principle ${conceptBy[S.concept].number} · ${conceptBy[S.concept].name}` : 'All principles';
}
const rFrom = $('#rFrom'), rTo = $('#rTo');
[rFrom, rTo].forEach(r => { r.min = Y0; r.max = Y1; r.step = 1; });
function drawRange(){
  rFrom.value = S.from; rTo.value = S.to;
  $('#yFrom').textContent = S.from; $('#yTo').textContent = S.to;
  const w = (Y1-Y0) || 1; $('#rFill').style.left = ((S.from-Y0)/w*100)+'%'; $('#rFill').style.right = ((Y1-S.to)/w*100)+'%';
}
rFrom.addEventListener('input', () => { S.from = Math.min(+rFrom.value, S.to); drawRange(); });
rTo.addEventListener('input', () => { S.to = Math.max(+rTo.value, S.from); drawRange(); });
[rFrom, rTo].forEach(r => r.addEventListener('change', () => set({})));
$('#pIn').addEventListener('change', e => { const h = nameToH[e.target.value.trim().toLowerCase()]; if (h) set({person:h, pick:''}); });
$('#pClear').addEventListener('click', () => { $('#pIn').value=''; set({person:'', depth:0}); });
document.querySelectorAll('#depth button').forEach(b => b.addEventListener('click', () => S.person && set({depth:+b.dataset.d})));
document.querySelectorAll('#lenses button').forEach(b => b.addEventListener('click', () => { if (b.dataset.l==='feedback' && S.lens!=='feedback' && S.lens!=='about') fbFrom = location.href; set({lens:b.dataset.l}); }));
$('#reset').addEventListener('click', () => { $('#pIn').value=''; set({from:Y0,to:Y1,concept:'',person:'',depth:0,cols:new Set(cols.map(c=>c.handle)),pick:'',knobs:{...KDEF}}); });
$('#share').addEventListener('click', async () => { try { await navigator.clipboard.writeText(location.href); $('#share').textContent='Link copied'; } catch(e) { $('#share').textContent='Copy from address bar'; } setTimeout(()=>$('#share').textContent='Copy link',1600); });
function drawCols(){
  $('#cols').innerHTML = cols.map(c => `<button class="chip${S.cols.has(c.handle)?'':' off'}" data-c="${c.handle}" title="${esc(c.name)} (${c.count})"><i style="background:${colColor[c.handle]}"></i>${esc(short(c.name))}</button>`).join('');
  $('#cols').querySelectorAll('.chip').forEach(b => b.addEventListener('click', ev => {
    const c = b.dataset.c, n = new Set(S.cols);
    if (ev.altKey || ev.metaKey) { set({cols:new Set([c])}); return; }

    const K = KNOBS.find(x => x.k === k.dataset.k);
    const setV = v => { v = Math.max(0, Math.min(6, v)); if (v !== S.knobs[K.k]) { S.knobs = {...S.knobs, [K.k]: v}; writeHash(); render(); } };
    k.addEventListener('keydown', e => { if (['ArrowUp','ArrowRight'].includes(e.key)) { e.preventDefault(); setV(S.knobs[K.k]+1); refocus(K.k); } if (['ArrowDown','ArrowLeft'].includes(e.key)) { e.preventDefault(); setV(S.knobs[K.k]-1); refocus(K.k); } });
    k.addEventListener('wheel', e => { e.preventDefault(); setV(S.knobs[K.k] + (e.deltaY < 0 ? 1 : -1)); }, {passive:false});
    k.addEventListener('pointerdown', e => {
      e.preventDefault(); k.setPointerCapture(e.pointerId);
      const pt = svg.createSVGPoint();
      const move = ev => { pt.x = ev.clientX; pt.y = ev.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse());
        let a = Math.atan2(p.x - K.x, -(p.y - K.y)) * 180/Math.PI; a = Math.max(-135, Math.min(135, a));
        const v = Math.round((a + 135)/45); if (v !== S.knobs[K.k]) { S.knobs = {...S.knobs, [K.k]: v}; k.setAttribute('transform', `translate(${K.x},${K.y}) rotate(${-135+v*45})`); } };
      const up = () => { k.removeEventListener('pointermove', move); k.removeEventListener('pointerup', up); writeHash(); render(); };
      k.addEventListener('pointermove', move); k.addEventListener('pointerup', up);
    });
  });
  const r = document.getElementById('eRestart'); if (r) r.onclick = () => { Object.assign(E, {turn:0, M:{}, F:{}, B:{}, offers:[], seen:new Set(), log:[], last:null, lampExt:false, lampInt:false, lampHold:false, lampBored:false, poolKey:''}); render(); };
}
function refocus(k){ setTimeout(() => { const n = document.querySelector(`#plate .knob[data-k="${k}"]`); if (n) n.focus(); }, 0); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-e]'); if (b) { eRespond(b.dataset.e, +b.dataset.s); return; }
  const o = e.target.closest('[data-open]'); if (o) setTimeout(() => eRespond(o.dataset.open, .5), 0);
});

/* ---------- About ---------- */
function about(){
  const d = document.createElement('div'); d.className = 'about';
  d.innerHTML = `<h2>About Archive Lenses</h2>
  <p>Archive Lenses is a sister site to the <a href="https://living-archive-rho.vercel.app/" target="_blank" rel="noopener">ASC Living Archive</a>, made by the ASC Archives Working Group: one body of archive material, many ways of looking at it.</p>
  <p>You hold a few <strong>handles</strong>. Each handle sets a <strong>selector</strong>, which decides what part of the archive is in play. Any <strong>lens</strong> then shows that selection in its own way. Turn a handle and every lens follows; change lens and your selection comes with you.</p>
  <h3>The handles</h3>
  <dl>
   <dt>Principle</dt><dd>The dial of the seven Cybernetics Literacy principles: circularity, variety, self-organisation, the observer, distinction, conversation, and ethics and choice. Click a sector to choose one, the center for all.</dd>
   <dt>Time</dt><dd>A two-ended slider from the earliest item to today.</dd>
   <dt>Person</dt><dd>Type a name, then choose how far out to look: their own work, one step out to the people they appear with, or two steps.</dd>
   <dt>Collections</dt><dd>Turn collections on and off: the conference websites, PATTERNS, the old and current ASC websites, the Cybernetics of Cybernetics Competition, the 2009 by-laws consultation and Cybernetics Literacy.</dd>
  </dl>
  <h3>The lenses</h3>
  <dl>
   <dt>River</dt><dd>Time flows left to right and each collection is a stream whose width is the number of selected items that year. The pale bed behind shows the whole archive, so you can see what your handles leave out. Gold lines mark ASC conferences.</dd>
   <dt>Ring</dt><dd>The seven principles drawn as a ring in which the seventh returns to the first. Each item is a dot, placed outward by year and colored by collection.</dd>
   <dt>Reading room</dt><dd>The selection as a list by decade. Names and principles are handles too: click one to turn it.</dd>
   <dt>Eucrates</dt><dd>Suggested by Claudia Westermann as a different kind of lens. It converses, after Gordon Pask&rsquo;s teaching machines and the instrumentation panel believed to be from his Eucrates project (1955, with Robin McKinnon-Wood and C.E.G. Bailey), as described in Usman Haque&rsquo;s &ldquo;The Architectural Relevance of Gordon Pask&rdquo; (2007). It offers five items and listens to how you respond. Its knobs set its character: external and internal awareness, oblivescence, reinforce memory, obstinacy, and novelty, the unlabeled knob, which sets how soon it grows bored of repetition, as Pask&rsquo;s MusiColour did.</dd>
  </dl>
  <h3>Sharing what you see</h3>
  <p>The address bar records every handle, the lens and, for Eucrates, the knob settings. Copy the link and anyone who opens it sees the same view.</p>
  <h3>The material</h3>
  <p>Every item, person, place, principle and collection has a permanent handle, such as <span class="mono">item:e8bb5e6f4a</span> or <span class="mono">person:gordon-pask</span>. All ASC archive interfaces read the same shared data, which is also ready to load into a graph database. Links between items and principles are a first pass, found by keyword, and will improve as talk transcripts and full texts are added. Links to anything containing personal contact details are withheld until reviewed. Originals remain with their authors and on asc-cybernetics.org.</p>
  <p>Corrections and suggestions are welcome on the <a href="#lens=feedback">Feedback</a> page.</p>`;
  $('#say').innerHTML = '';
  return d;
}
/* ---------- Feedback ---------- */
const FB_TO = ['peter.tuddenham','asc-cybernetics.org'].join('@');
let fbFrom = '';
function feedback(){
  const d = document.createElement('div'); d.className = 'fb';
  const it = S.pick && byH[S.pick];
  d.innerHTML = `<h2 style="font:700 22px 'Bricolage Grotesque',sans-serif;margin:0 0 8px">Feedback and corrections</h2>
   <p>Tell the ASC Archives Working Group what you think of these lenses, suggest a new one, or point out a wrong name, date or link. The view you came from is attached, so we can see exactly what you saw.</p>
   <form id="fbForm">
    <label for="fbKind">What is it about?</label>
    <select id="fbKind"><option>A lens or the handles</option><option>An idea for a new lens</option><option>A correction (name, date, title)</option><option>Personal details that should be withheld</option><option>Something missing from the archive</option><option>Something else</option></select>
    <label for="fbItem">Which item? <span class="fbnote">(optional)</span></label>
    <input id="fbItem" type="text" value="${it ? esc(it.title + ' (' + (it.date || it.year || 'undated') + ') ' + it.handle) : ''}" placeholder="Title or handle">
    <label for="fbMsg">Your message</label>
    <textarea id="fbMsg" required></textarea>
    <label for="fbName">Your name <span class="fbnote">(optional)</span></label>
    <input id="fbName" type="text" autocomplete="name">
    <button class="send" type="submit">Send by email</button>
    <p class="fbnote">This opens a pre-filled message in your email program, addressed to the Archives Working Group, so you can check it before sending. Nothing is stored on this site.</p>
   </form>`;
  $('#say').innerHTML = '';
  setTimeout(() => { const f = document.getElementById('fbForm'); if (!f) return; f.onsubmit = e => {
    e.preventDefault();
    const msg = $('#fbMsg').value.trim(); if (!msg) { $('#fbMsg').focus(); return; }
    const item = $('#fbItem').value.trim(), name = $('#fbName').value.trim();
    const body = msg + '\n\n' + (item ? 'Item: ' + item + '\n' : '') + 'View: ' + (fbFrom || location.href) + '\n' + (name ? 'From: ' + name + '\n' : '') + 'Sent from ASC Archive Lenses';
    location.href = 'mailto:' + FB_TO + '?subject=' + encodeURIComponent('Archive Lenses feedback: ' + $('#fbKind').value) + '&body=' + encodeURIComponent(body);
  }; }, 0);
  return d;
}
/* ---------- render ---------- */
function render(){
  document.querySelectorAll('#lenses button').forEach(b => b.classList.toggle('on', b.dataset.l===S.lens));
  document.querySelectorAll('#depth button').forEach(b => { b.classList.toggle('on', +b.dataset.d===S.depth); b.disabled = !S.person; });
  if (S.person && people[S.person]) $('#pIn').value = people[S.person].name;
  drawDial(); drawRange(); drawCols();
  const sel = select();
  const stage = $('#stage'); stage.innerHTML = '';
  stage.append(S.lens==='ring' ? ring(sel) : S.lens==='reading' ? reading(sel) : S.lens==='eucrates' ? eucrates(sel) : S.lens==='about' ? about() : S.lens==='feedback' ? feedback() : river(sel));
  $('#count').textContent = sel.length.toLocaleString();
  const parts = [];
  if (S.from!==Y0 || S.to!==Y1) parts.push(S.from===S.to ? S.from : `${S.from}–${S.to}`);
  if (S.concept) parts.push(conceptBy[S.concept].name);
  if (S.person) parts.push(people[S.person].name + (S.depth ? ` + ${S.depth} step${S.depth>1?'s':''} (${circle().size} people)` : ''));
  if (S.cols.size !== cols.length) parts.push(S.cols.size + ' collection' + (S.cols.size>1?'s':''));
  $('#countSub').textContent = 'of ' + items.length.toLocaleString() + (parts.length ? ' · ' + parts.join(' · ') : ' · the whole archive');
  const it = S.pick && byH[S.pick];
  $('#detail').innerHTML = it ? `<div class="detail">${itemCore(it)}<div class="mono" style="color:var(--muted)">handle: ${esc(it.handle)}</div></div>` : '';
  $('#list').innerHTML = sel.slice().sort((a,b)=>(b.year||0)-(a.year||0)).slice(0, 80).map(i => `<li data-h="${i.handle}"><div class="t">${esc(i.title)}</div><div class="mono m">${esc(i.date || i.year || 'undated')} · ${esc(short(colName[i.collection]))}</div></li>`).join('')
    + (sel.length > 80 ? `<li class="mono m" style="cursor:default">… and ${sel.length-80} more</li>` : '');
}
$('#foot').innerHTML = `${D.items.length.toLocaleString()} items · ${D.people.length} people · ${D.concepts.length} principles · data version ${esc(D.version)} · read from <span class="mono">${esc(source)}</span>. A sister site to the <a href="https://living-archive-rho.vercel.app/" target="_blank" rel="noopener">ASC Living Archive</a>, by the ASC Archives Working Group.`;
window.addEventListener('hashchange', () => { readHash(); render(); });
readHash(); render();
})();
